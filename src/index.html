<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file: blob:; img-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Wavr</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span id="titlebar-logo">wavr</span>
    <span id="titlebar-song"></span>
  </div>

  <div id="main">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-nav">
        <div class="nav-item active" data-page="home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </div>
        <div class="nav-item" data-page="library">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Library
        </div>
        <div class="nav-item" data-page="playlists">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Playlists
        </div>
        <div class="nav-item" data-page="stats">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Statistics
        </div>
      </div>

      <div class="sidebar-divider"></div>
      <div class="sidebar-section">Playlists</div>
      <div id="playlist-nav"></div>

      <div class="sidebar-footer">
        <div class="nav-item" id="btn-add-songs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Add songs
        </div>
        <div class="nav-item" id="btn-sync-folder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Sync folder
        </div>
        <div class="nav-item" id="btn-open-folder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Open music folder
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="content"></div>
  </div>

  <!-- PLAYER BAR -->
  <div id="player">
    <div class="player-left">
      <div id="player-thumb" class="player-thumb">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="player-meta">
        <div id="player-song" class="player-song">Nothing playing</div>
        <div id="player-artist" class="player-artist">—</div>
      </div>
      <div class="player-expand-btn" title="Expand (L)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
      </div>
    </div>

    <div class="player-center">
      <div class="player-btns">
        <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-prev">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="play-btn" id="btn-play">
          <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-repeat" title="Repeat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="progress-wrap">
        <span id="time-cur" class="time">0:00</span>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <span id="time-dur" class="time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="ctrl-btn" id="btn-lyrics" title="Lyrics">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11l5 3v-5z"/>
          <path d="M7 8h10M7 12h10M7 16h5"/>
        </svg>
      </button>
      <div style="width:12px"></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text3)"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <div class="vol-track" id="vol-track">
        <div class="vol-fill" id="vol-fill" style="width:80%"></div>
      </div>
    </div>
  </div>

  <div id="lyrics-view">
    <button id="lyrics-close" class="ctrl-btn" title="Close" style="position:absolute; top:24px; right:24px; z-index:10;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    
    <div id="np-left">
      <div id="np-cover-wrap">
        <img id="np-cover" src="" style="display:none">
        <div id="np-cover-placeholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
      </div>
      <div id="np-info">
        <div id="lyrics-song">Song Name</div>
        <div id="lyrics-artist">Artist Name</div>
      </div>
      
      <div class="np-controls">
        <div class="progress-wrap">
          <span id="np-time-cur" class="time">0:00</span>
          <div class="progress-track" id="np-progress-track">
            <div class="progress-fill" id="np-progress-fill"></div>
            <div class="progress-thumb" id="np-progress-thumb"></div>
          </div>
          <span id="np-time-dur" class="time">0:00</span>
        </div>
        
        <div class="player-btns" style="justify-content:center; margin-top:16px;">
          <button class="ctrl-btn" id="np-btn-shuffle" title="Shuffle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
          </button>
          <button class="ctrl-btn" id="np-btn-prev">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button class="play-btn" id="np-btn-play" style="width:48px;height:48px;">
            <svg id="np-play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="np-pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="ctrl-btn" id="np-btn-next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button class="ctrl-btn" id="np-btn-repeat" title="Repeat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
      </div>
    </div>
    
    <div id="lyrics-content">
      <div id="lyrics-container"></div>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="overlay" id="modal-importing" style="display:none">
  <div class="modal" style="width:340px;text-align:center">
    <div class="modal-title">Importing songs…</div>
    <div id="import-progress" style="color:var(--text2);font-size:13px;margin-top:8px"></div>
  </div>
</div>

<div class="overlay" id="modal-playlist" style="display:none">
  <div class="modal">
    <div class="modal-title" id="pl-modal-title">New playlist</div>
    <div class="modal-field">
      <div class="modal-label">Cover image</div>
      <div class="cover-upload" id="cover-upload">
        <img id="cover-preview" style="display:none">
        <span id="cover-label">Click to upload image</span>
      </div>
      <input type="file" id="cover-file-input" accept="image/*" style="display:none">
    </div>
    <div class="modal-field">
      <div class="modal-label">Name</div>
      <input class="modal-input" id="pl-name" placeholder="Playlist name" maxlength="60">
    </div>
    <div class="modal-field">
      <div class="modal-label">Description <span style="color:var(--text3)">(optional)</span></div>
      <input class="modal-input" id="pl-desc" placeholder="What's this playlist about?">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="pl-cancel">Cancel</button>
      <button class="btn btn-primary" id="pl-save">Create</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-add-to-pl" style="display:none">
  <div class="modal" style="width:340px">
    <div class="modal-title">Add to playlist</div>
    <div id="pl-picker"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="add-to-pl-cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-lyrics-gen" style="display:none">
  <div class="modal" style="width:480px">
    <div class="modal-title" id="lyrics-gen-title">Generating Lyrics…</div>
    <div id="lyrics-gen-overall" style="font-size:12px;color:var(--text3);margin-bottom:14px">Preparing…</div>
    <div class="lyrics-gen-progress-bar-wrap">
      <div class="lyrics-gen-progress-bar" id="lyrics-gen-bar" style="width:0%"></div>
    </div>
    <div id="lyrics-gen-log" class="lyrics-gen-log"></div>
    <div class="modal-actions" id="lyrics-gen-actions" style="display:none">
      <button class="btn btn-primary" id="lyrics-gen-close">Done</button>
    </div>
  </div>
</div>

<div id="ctx-menu" class="ctx-menu" style="display:none"></div>
<div id="notification" class="notification" style="display:none"></div>

<audio id="audio"></audio>
<script src="app.js"></script>
</body>
</html>
